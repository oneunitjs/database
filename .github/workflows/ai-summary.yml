name: AI PR Summary

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  summarize:
    name: Generate AI summary
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}..${{ github.head_ref }} --stat)
          printf 'diff<<EOF\n%s\nEOF\n' "$DIFF" >> $GITHUB_OUTPUT

      - name: Generate AI summary
        id: summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            printf 'summary<<EOF\n%s\nEOF\n' "## AI Summary\n\nAdd \`OPENAI_API_KEY\` secret to enable AI-generated PR summaries." >> $GITHUB_OUTPUT
            exit 0
          fi

          RESPONSE=$(curl -s -X POST https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\":\"system\",\"content\":\"You are a helpful assistant that summarizes pull requests. Be concise and focus on what changed, why it matters, and any risks.\"},
                {\"role\":\"user\",\"content\":\"PR Title: $PR_TITLE\n\nPR Description: $PR_BODY\n\nChanged files:\\n$PR_DIFF\\n\nSummarize this pull request in markdown.\"}
              ]
            }")

          SUMMARY=$(node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              try{const j=JSON.parse(d);console.log(j.choices[0].message.content)}
              catch(e){console.log('## AI Summary\n\nFailed to generate summary.')}
            })
          " <<< "$RESPONSE")
          printf 'summary<<EOF\n%s\nEOF\n' "$SUMMARY" >> $GITHUB_OUTPUT

      - name: Post or update summary comment
        uses: actions/github-script@v9
        with:
          script: |
            const summary = `${{ steps.summary.outputs.summary }}`;
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const aiComment = existing.data.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('## AI Summary'));
            if (aiComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: aiComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
